<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세홍과학 · 중간고사 대비 훈련 50제</title>
<style>
.sh3{--bg:#EDF1F4;--panel:#FFFFFF;--ink:#1B2430;--sub:#5B6776;--line:#D3DAE1;--amber:#F2B705;--amber-soft:#FFF4CC;--ok:#1E8E5A;--ok-soft:#E4F4EA;--bad:#C8453B;--bad-soft:#FBE8E5;
  font-family:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color:var(--ink);background:var(--bg);min-height:100vh;padding:20px 16px 40px;box-sizing:border-box;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
.sh3 *{box-sizing:border-box}
.sh3 button{font:inherit;color:inherit;cursor:pointer}
.sh3 button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sh3 .wrap{max-width:780px;margin:0 auto}
.sh3 .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.sh3 .sector{font-size:13px;color:var(--sub);font-weight:600}
.sh3 h1{font-size:24px;line-height:1.25;margin:2px 0 0;font-weight:800;letter-spacing:-.01em}
.sh3 .count{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.sh3 .count b{color:var(--ink);font-size:18px}
/* 동력 셀 게이지 = 문항 목록 */
.sh3 .gauge{display:flex;gap:10px;flex-wrap:wrap;background:var(--ink);padding:10px 12px;border-radius:10px;margin-bottom:14px}
.sh3 .bank{display:flex;flex-direction:column;gap:4px}
.sh3 .bank span{font-size:11px;color:#AEB9C5;font-weight:600}
.sh3 .cells{display:flex;gap:3px}
.sh3 .cell{width:18px;height:26px;border-radius:3px;border:1px solid #3C4A5A;background:#26313E;padding:0;font-size:10px;color:#8E9BAA;display:flex;align-items:flex-end;justify-content:center;font-variant-numeric:tabular-nums}
.sh3 .cell.done{background:var(--amber);border-color:var(--amber);color:#3A2E00}
.sh3 .cell.cur{outline:2px solid #fff;outline-offset:1px}
.sh3 .cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sh3 .cell.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.sh3 .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px}
.sh3 .meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sh3 .tag{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.sh3 .tag.lv{border-color:var(--ink);color:var(--ink)}
.sh3 .tag.lv-최상{background:var(--ink);color:#fff}
.sh3 .shared{background:#F4F6F8;border-left:4px solid var(--ink);padding:10px 14px;margin-bottom:14px;border-radius:0 8px 8px 0}
.sh3 .shared p{margin:0 0 6px}
.sh3 .shared .gl{font-weight:800}
.sh3 .qtext{font-size:17px;margin:0 0 10px}
.sh3 .qtext .no{font-weight:800;margin-right:4px}
.sh3 .fig{text-align:center;margin:10px 0}
.sh3 .fig svg{max-width:100%;height:auto}
.sh3 svg text{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.sh3 table.dt{border-collapse:collapse;margin:0 auto;font-size:14.5px}
.sh3 table.dt th,.sh3 table.dt td{border:1px solid #9AA6B2;padding:3px 10px;text-align:center}
.sh3 table.dt th{background:#EEF1F4;font-weight:700}
.sh3 .story{border:1px solid #9AA6B2;border-radius:8px;padding:10px 14px;margin-top:8px;background:#fff}
.sh3 .story p{margin:0 0 6px}
.sh3 .bogi{border:1.5px solid var(--ink);border-radius:8px;padding:14px 14px 8px;margin:14px 0 12px;position:relative}
.sh3 .bogi .bl{position:absolute;top:-11px;left:14px;background:var(--panel);padding:0 6px;font-size:13px;font-weight:700}
.sh3 .bogi p{margin:0 0 6px;padding-left:1.6em;text-indent:-1.6em}
.sh3 .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sh3 .opts.inline{flex-direction:row;flex-wrap:wrap}
.sh3 .opt{display:flex;gap:8px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;font-size:16px;line-height:1.5;transition:border-color .12s,background .12s}
.sh3 .opts.inline .opt{flex:1 1 120px;justify-content:center;align-items:center}
.sh3 .opt:hover{border-color:#8D99A6}
.sh3 .opt .n{font-weight:800;flex:none}
.sh3 .opt[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--ink)}
.sh3 .opt.is-ans{background:var(--ok-soft);border-color:var(--ok)}
.sh3 .opt.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.sh3 .pair .phead,.sh3 .pair .opt{display:grid;grid-template-columns:2.2em 1fr 1fr;gap:6px;text-align:center}
.sh3 .pair .phead{font-size:13px;font-weight:700;color:var(--sub);padding:0 14px}
.sh3 .hintbox{margin-top:14px;background:var(--amber-soft);border:1px dashed #C9A200;border-radius:8px;padding:9px 13px;font-size:15px}
.sh3 .hintbox b{margin-right:6px}
.sh3 .bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sh3 .btn{border:1.5px solid var(--ink);background:#fff;border-radius:9px;padding:10px 18px;font-weight:700;font-size:15px}
.sh3 .btn.primary{background:var(--ink);color:#fff}
.sh3 .btn.amber{background:var(--amber);border-color:var(--amber);color:#2B2200}
.sh3 .btn:disabled{opacity:.35;cursor:default}
.sh3 .grow{flex:1}
.sh3 .nw{white-space:nowrap}
.sh3 .keys{font-size:12.5px;color:var(--sub);margin-top:10px}
/* 시작 화면 */
.sh3 .lead{font-size:16px;margin:0 0 16px}
.sh3 .partsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:6px 0 16px}
.sh3 .ps{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;background:#fff;text-align:left}
.sh3 .ps[aria-pressed="true"]{border-color:var(--ink);background:var(--amber-soft)}
.sh3 .ps small{color:var(--sub);font-size:13px}
.sh3 .partsel.two{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.sh3 .partsel.two .ps small{display:block;margin-top:2px}
.sh3 .resume{margin-bottom:14px;border-color:var(--ink)}
.sh3 .resume p{margin:0}
.sh3 .fb{margin-top:14px;border-radius:9px;padding:12px 14px;font-size:15.5px}
.sh3 .fb.ok{background:var(--ok-soft);border:1.5px solid var(--ok)}
.sh3 .fb.bad{background:var(--bad-soft);border:1.5px solid var(--bad)}
.sh3 .fb p{margin:0}
.sh3 .fb .fh{font-weight:800;margin-bottom:4px}
.sh3 .legend{font-size:14px;color:var(--sub);margin:0 0 16px}
.sh3 h2{font-size:17px;margin:0 0 6px}
/* 결과 */
.sh3 .score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh3 .score .big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sh3 .score .of{font-size:18px;color:var(--sub)}
.sh3 .stat{font-size:15px;color:var(--sub);margin:6px 0 16px}
.sh3 .rows{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:18px}
.sh3 .row{display:grid;grid-template-columns:12em 1fr 4.2em;gap:10px;align-items:center;font-size:14px}
.sh3 .track{height:10px;background:#E3E8ED;border-radius:5px;overflow:hidden}
.sh3 .fill{height:100%;background:var(--ink)}
.sh3 .row .v{text-align:right;font-variant-numeric:tabular-nums}
.sh3 .filters{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.sh3 .fbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600}
.sh3 .fbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.sh3 .rv{border-top:1px solid var(--line);padding:12px 0}
.sh3 .rv .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.sh3 .mark{font-weight:800;padding:1px 8px;border-radius:6px;font-size:13px}
.sh3 .mark.ok{background:var(--ok-soft);color:var(--ok)}
.sh3 .mark.bad{background:var(--bad-soft);color:var(--bad)}
.sh3 .rv .sol{margin:8px 0 0;font-size:15px}
.sh3 .rv details{margin-top:8px}
.sh3 .rv summary{cursor:pointer;font-size:14px;color:var(--sub);font-weight:600}
.sh3 .rv .qview{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:14px}
/* 모달 */
.sh3 .modal{position:fixed;inset:0;background:rgba(27,36,48,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.sh3 .modal.open{display:flex}
.sh3 .mbox{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:20px}
.sh3 .mbox p{margin:0 0 14px;font-size:16px}
.sh3 .mbox .bar{justify-content:flex-end}
@media (max-width:560px){.sh3{padding:12px 8px 30px}.sh3 .panel{padding:16px 14px}.sh3 h1{font-size:20px}.sh3 .cell{width:14px;height:22px;font-size:0}.sh3 .row{grid-template-columns:7em 1fr 3.6em}}
@media (prefers-reduced-motion:reduce){.sh3 *{transition:none!important}}
</style>
</head>

": "질량이 3 kg인 물체가 기준면으로부터 10 m 높이에 있다. 이 물체의 위치 에너지는?", "kind": "num", "ans": 2, "sol": "위치 에너지 = 9.8 × 질량 × 높이 = 9.8 × 3 × 10 = 294 J이다.", "hint": "위치 에너지 = 9.8 × 질량 × 높이", "opts": ["30 J", "294 J", "300 J", "588 J", "2940 J"], "inline": true}, {"no": 23, "part": 2, "lv": "하", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "질량이 2 kg인 물체가 5 m/s의 속력으로 운동하고 있다. 이 물체의 운동 에너지는?", "kind": "num", "ans": 3, "sol": "운동 에너지 = ½ × 질량 × 속력² = ½ × 2 × 5² = 25 J이다. ①은 속력을 제곱하지 않은 값, ④는 ½을 빠뜨린 값이다.", "hint": "운동 에너지 = ½ × 질량 × 속력²", "opts": ["5 J", "10 J", "25 J", "50 J", "100 J"], "inline": true}, {"no": 24, "part": 2, "lv": "중", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "어떤 물체의 속력이 처음의 3배가 되었다. 이 물체의 운동 에너지는 처음의 몇 배가 되는가?", "kind": "num", "ans": 4, "sol": "운동 에너지는 속력의 제곱에 비례하므로 속력이 3배가 되면 운동 에너지는 3² = 9배가 된다.", "hint": "운동 에너지는 속력의 제곱에 비례합니다.", "opts": ["1/3배", "3배", "6배", "9배", "27배"], "inline": true}, {"no": 25, "part": 2, "lv": "중", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "질량이 2 kg인 화분이 지면으로부터 높이 5 m인 곳에 있다. 지면을 기준면으로 할 때와, 지면으로부터 높이 2 m인 계단참을 기준면으로 할 때 화분의 위치 에너지를 옳게 짝지은 것은?", "kind": "pair", "ans": 4, "sol": "지면 기준 높이는 5 m이므로 9.8 × 2 × 5 = 98 J, 계단참 기준 높이는 5 − 2 = 3 m이므로 9.8 × 2 × 3 = 58.8 J이다. ③은 계단참 기준 높이를 2 m로 착각한 실수이다.", "hint": "기준면이 바뀌면 높이가 달라집니다. 계단참에서 화분까지의 높이는?", "head": ["지면 기준", "계단참 기준"], "rows": [["39.2 J", "58.8 J"], ["58.8 J", "39.2 J"], ["98 J", "39.2 J"], ["98 J", "58.8 J"], ["98 J", "98 J"]]}, {"no": 26, "part": 2, "lv": "중", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "크레인이 질량이 200 kg인 물체를 지면에서 10 m 높이까지 일정한 속력으로 들어 올렸다. 이에 대한 설명으로 옳은 것만을 <span class=\"nw\">&lt;보기&gt;<\/span>에서 있는 대로 고른 것은? (단, 지면을 기준면으로 한다.)", "kind": "bogi", "ans": 1, "sol": "한 일 = 9.8 × 200 × 10 = 19600 J이고, 한 일만큼 위치 에너지도 19600 J 증가한다. 1960 J은 높이 10 m를 곱하지 않은 값이다. 한 일은 높이에 비례하므로 높이가 절반이면 한 일도 절반이다.", "hint": "들어 올리는 데 한 일만큼 위치 에너지가 증가합니다. 높이가 절반이면 한 일은?", "bogi": ["크레인이 물체에 한 일은 19600 J이다.", "물체의 위치 에너지는 1960 J 증가하였다.", "같은 물체를 5 m 높이까지만 들어 올리면 크레인이 한 일은 처음의 1/4이 된다."], "opts": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "inline": true}, {"no": 27, "part": 2, "lv": "상", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "마찰이 없는 수평면에 정지해 있던 질량이 2 kg인 수레를 12 N의 힘으로 밀어, 힘의 방향으로 3 m 이동시켰다. 이때 수레의 속력은?", "kind": "num", "ans": 2, "sol": "수레에 한 일은 12 N × 3 m = 36 J이고, 한 일만큼 운동 에너지가 된다. ½ × 2 × v² = 36에서 v² = 36이므로 v = 6 m/s이다. ④는 v² 값을 그대로 쓴 실수이다.", "hint": "수레에 한 일만큼 운동 에너지가 됩니다. ½ × 2 × v² = (한 일)", "opts": ["3 m/s", "6 m/s", "18 m/s", "36 m/s", "72 m/s"], "inline": true}, {"no": 28, "part": 2, "lv": "상", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "질량이 2 kg인 공을 지면으로부터 10 m 높이에서 가만히 놓았다. 이에 대한 설명으로 옳은 것만을 <span class=\"nw\">&lt;보기&gt;<\/span>에서 있는 대로 고른 것은? (단, 지면을 기준면으로 하고, 공기 저항은 무시한다.)", "kind": "bogi", "ans": 5, "sol": "중력이 한 일 = 9.8 × 2 × 10 = 196 J이고, 중력이 한 일만큼 운동 에너지가 된다. ½ × 2 × v² = 196에서 v² = 196이므로 v = 14 m/s이다.", "hint": "중력이 한 일(9.8 × 질량 × 높이)만큼 지면에 닿는 순간의 운동 에너지가 됩니다.", "bogi": ["지면에 닿는 순간 공의 속력은 14 m/s이다.", "지면에 닿는 순간 공의 운동 에너지는 196 J이다.", "지면에 닿을 때까지 중력이 공에 한 일은 196 J이다."], "opts": ["ㄱ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "inline": true}, {"no": 29, "part": 3, "lv": "하", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "역학적 에너지에 대한 설명으로 옳은 것은?", "kind": "sent", "ans": 1, "sol": "역학적 에너지는 위치 에너지와 운동 에너지의 합이다. 공기 저항이나 마찰이 없을 때만 보존되며, 마찰이 있으면 일부가 열에너지 등으로 전환되어 감소한다.", "hint": "역학적 에너지 = 위치 에너지 + 운동 에너지", "opts": ["위치 에너지와 운동 에너지의 합이다.", "물체가 높이 있을수록 운동 에너지가 크다.", "물체의 속력이 빠를수록 위치 에너지가 크다.", "마찰이 있어도 역학적 에너지는 항상 보존된다.", "공기 저항이 있으면 역학적 에너지가 점점 증가한다."], "inline": false}, {"no": 30, "part": 3, "lv": "하", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "공기 저항을 무시할 때, 떨어지고 있는 물체의 에너지 변화에 대한 설명으로 옳은 것은?", "kind": "sent", "ans": 1, "sol": "물체가 떨어지면 높이가 낮아져 위치 에너지는 감소하고, 속력이 빨라져 운동 에너지는 증가한다. 즉 위치 에너지가 운동 에너지로 전환되며 역학적 에너지는 일정하다.", "hint": "떨어지는 동안 높이와 속력이 각각 어떻게 변할까요?", "opts": ["위치 에너지가 운동 에너지로 전환된다.", "떨어지는 동안 역학적 에너지가 점점 감소한다.", "높이가 낮아질수록 위치 에너지가 점점 증가한다.", "운동 에너지가 점점 감소하다가 지면에서 0이 된다.", "운동 에너지가 위치 에너지로 전환되어 속력이 느려진다."], "inline": false}, {"no": 31, "part": 3, "lv": "하", "group": "", "g": "", "pre": "표는 질량이 3 kg인 공을 지면으로부터 높이 10 m인 곳에서 가만히 놓았을 때, 높이에 따른 공의 위치 에너지와 운동 에너지를 나타낸 것이다.", "fig": "", "table": "<table class='dt'><tr><th>높이(m)<\/th><th>위치 에너지(J)<\/th><th>운동 에너지(J)<\/th><\/tr><tr><td>10<\/td><td>294<\/td><td>0<\/td><\/tr><tr><td>6<\/td><td>176.4<\/td><td>(가)<\/td><\/tr><tr><td>2<\/td><td>(나)<\/td><td>235.2<\/td><\/tr><\/table>", "stem": "(가)와 (나)에 들어갈 값을 옳게 짝지은 것은? (단, 지면을 기준면으로 하고, 공기 저항은 무시한다.)", "kind": "pair", "ans": 2, "sol": "역학적 에너지는 처음 위치 에너지인 294 J로 일정하다. (가) = 294 − 176.4 = 117.6 J, (나) = 294 − 235.2 = 58.8 J이다. (나)는 9.8 × 3 × 2로 구해도 같다.", "hint": "역학적 에너지는 처음 위치 에너지(294 J)로 일정합니다.", "head": ["(가)", "(나)"], "rows": [["58.8 J", "117.6 J"], ["117.6 J", "58.8 J"], ["117.6 J", "176.4 J"], ["176.4 J", "58.8 J"], ["235.2 J", "58.8 J"]]}, {"no": 32, "part": 3, "lv": "중", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "질량이 0.5 kg인 공을 지면에서 14 m/s의 속력으로 위로 던져 올렸다. 공이 올라갈 수 있는 최고 높이는? (단, 지면을 기준면으로 하고, 공기 저항은 무시한다.)", "kind": "num", "ans": 4, "sol": "던질 때 운동 에너지는 ½ × 0.5 × 14² = 49 J이고, 최고점에서 모두 위치 에너지가 된다. 9.8 × 0.5 × h = 49에서 h = 10 m이다.", "hint": "던질 때의 운동 에너지가 최고점에서 모두 위치 에너지로 바뀝니다.", "opts": ["1.4 m", "5 m", "7 m", "10 m", "20 m"], "inline": true}, {"no": 33, "part": 3, "lv": "중", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "공을 지면에서 위로 던져 올렸더니 최고 높이 H까지 올라갔다. 이에 대한 설명으로 옳은 것만을 <span class=\"nw\">&lt;보기&gt;<\/span>에서 있는 대로 고른 것은? (단, 지면을 기준면으로 하고, 공기 저항은 무시한다.)", "kind": "bogi", "ans": 5, "sol": "최고점에서 공은 순간적으로 멈추므로 운동 에너지가 0이다. 역학적 에너지는 일정하고, 높이가 H의 절반이면 위치 에너지가 전체의 절반이므로 나머지 절반인 운동 에너지와 같다.", "hint": "최고점에서의 속력은? 높이가 절반이면 위치 에너지는 전체의 얼마일까요?", "bogi": ["최고점에서 공의 운동 에너지는 0이다.", "공이 올라가는 동안 역학적 에너지는 증가한다.", "높이가 H의 절반인 지점에서 위치 에너지와 운동 에너지는 같다."], "opts": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "inline": true}, {"no": 34, "part": 3, "lv": "상", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "지면으로부터 높이 20 m인 곳에서 공을 가만히 놓았다. 공의 운동 에너지가 위치 에너지의 3배가 되는 지점의 높이는? (단, 지면을 기준면으로 하고, 공기 저항은 무시한다.)", "kind": "num", "ans": 2, "sol": "운동 에너지가 위치 에너지의 3배이면 위치 에너지는 역학적 에너지의 1/4이다. 위치 에너지는 높이에 비례하므로 높이는 20 m × 1/4 = 5 m이다. ④는 위치 에너지가 3배인 지점이다.", "hint": "운동 에너지가 위치 에너지의 3배이면, 위치 에너지는 역학적 에너지의 몇 분의 몇일까요?", "opts": ["2.5 m", "5 m", "10 m", "15 m", "18 m"], "inline": true}, {"no": 35, "part": 3, "lv": "중", "group": "35~37", "g": "<p>그림은 워터 슬라이드의 A점에서 질량이 40 kg인 사람이 가만히 출발하여 B점과 C점을 차례로 지나는 모습을 나타낸 것이다. 기준면으로부터 A점과 B점까지의 높이는 각각 10 m, 7.5 m이다. 물음에 답하시오. (단, C점을 지나는 면을 기준면으로 하고, 모든 마찰과 공기 저항은 무시한다.)<\/p><div class=\"fig\"><svg viewBox=\"0 0 330 190\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard\"><path d=\"M 10 25.0 L 40 25.0 C 90 25.0, 110 58.8, 170 58.8 C 215 58.8, 235 160.0, 290 160.0 L 322 160.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"3\"/><rect x=\"262\" y=\"160\" width=\"62\" height=\"18\" fill=\"#e6e6e6\" stroke=\"#111\" stroke-width=\"1\"/><text x=\"293\" y=\"173\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#111\">수영장<\/text><line x1=\"4\" y1=\"160\" x2=\"326\" y2=\"160\" stroke=\"#666\" stroke-dasharray=\"5 3\"/><text x=\"8\" y=\"174\" font-size=\"11\" text-anchor=\"start\" font-weight=\"500\" fill=\"#111\">기준면<\/text><circle cx=\"40\" cy=\"25.0\" r=\"4.5\" fill=\"#111\"/><text x=\"40\" y=\"15.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#111\">A<\/text><circle cx=\"170\" cy=\"58.8\" r=\"4.5\" fill=\"#111\"/><text x=\"170\" y=\"48.75\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#111\">B<\/text><circle cx=\"290\" cy=\"160.0\" r=\"4.5\" fill=\"#111\"/><text x=\"290\" y=\"150.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#111\">C<\/text><line x1=\"40\" y1=\"31.0\" x2=\"40\" y2=\"160\" stroke=\"#111\" stroke-width=\"1.1\"/><polygon points=\ 0\" cy=\"58.8\" r=\"4.5\" fill=\"#111\"/><text x=\"170\" y=\"48.75\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#111\">B<\/text><circle cx=\"290\" cy=\"160.0\" r=\"4.5\" fill=\"#111\"/><text x=\"290\" y=\"150.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#111\">C<\/text><line x1=\"40\" y1=\"31.0\" x2=\"40\" y2=\"160\" stroke=\"#111\" stroke-width=\"1.1\"/><polygon points=\"40,31.0 37,37.0 43,37.0\" fill=\"#111\"/><polygon points=\"40,160 37,154 43,154\" fill=\"#111\"/><text x=\"34\" y=\"96.5\" font-size=\"12\" text-anchor=\"end\" font-weight=\"500\" fill=\"#111\">10 m<\/text><line x1=\"170\" y1=\"64.8\" x2=\"170\" y2=\"160\" stroke=\"#111\" stroke-width=\"1.1\"/><polygon points=\"170,64.8 167,70.8 173,70.8\" fill=\"#111\"/><polygon points=\"170,160 167,154 173,154\" fill=\"#111\"/><text x=\"164\" y=\"113.375\" font-size=\"12\" text-anchor=\"end\" font-weight=\"500\" fill=\"#111\">7.5 m<\/text><\/svg><\/div>", "pre": "", "fig": "", "table": "", "stem": "C점에서 사람의 속력은 B점에서 속력의 몇 배인가?", "kind": "num", "ans": 1, "sol": "C점의 운동 에너지는 3920 J로 B점(980 J)의 4배이다. 운동 에너지는 속력의 제곱에 비례하므로 속력은 2배이다. ③ 4배는 운동 에너지의 비이다.", "hint": "운동 에너지가 4배이면 속력은 몇 배일까요? 운동 에너지는 속력의 제곱에 비례합니다.", "opts": ["2배", "3배", "4배", "8배", "16배"], "inline": true}, {"no": 37, "part": 3, "lv": "상", "group": "35~37", "g": "<p>그림은 워터 슬라이드의 A점에서 질량이 40 kg인 사람이 가만히 출발하여 B점과 C점을 차례로 지나는 모습을 나타낸 것이다. 기준면으로부터 A점과 B점까지의 높이는 각각 10 m, 7.5 m이다. 물음에 답하시오. (단, C점을 지나는 면을 기준면으로 하고, 모든 마찰과 공기 저항은 무시한다.)<\/p><div class=\"fig\"><svg viewBox=\"0 0 330 190\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard\"><path d=\"M 10 25.0 L 40 25.0 C 90 25.0, 110 58.8, 170 58.8 C 215 58.8, 235 160.0, 290 160.0 L 322 160.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"3\"/><rect x=\"262\" y=\"160\" width=\"62\" height=\"18\" fill=\"#e6e6e6\" stroke=\"#111\" stroke-width=\"1\"/><text x=\"293\" y=\"173\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#111\">수영장<\/text><line x1=\"4\" y1=\"160\" x2=\"326\" y2=\"160\" stroke=\"#666\" stroke-dasharray=\"5 3\"/><text x=\"8\" y=\"174\" font-size=\"11\" text-anchor=\"start\" font-weight=\"500\" fill=\"#111\">기준면<\/text><circle cx=\"40\" cy=\"25.0\" r=\"4.5\" fill=\"#111\"/><text x=\"40\" y=\"15.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#111\">A<\/text><circle cx=\"170\" cy=\"58.8\" r=\"4.5\" fill=\"#111\"/><text x=\"170\" y=\"48.75\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#111\">B<\/text><circle cx=\"290\" cy=\"160.0\" r=\"4.5\" fill=\"#111\"/><text x=\"290\" y=\"150.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#111\">C<\/text><line x1=\"40\" y1=\"31.0\" x2=\"40\" y2=\"160\" stroke=\"#111\" stroke-width=\"1.1\"/><polygon points=\"40,31.0 37,37.0 43,37.0\" fill=\"#111\"/><polygon points=\"40,160 37,154 43,154\" fill=\"#111\"/><text x=\"34\" y=\"96.5\" font-size=\"12\" text-anchor=\"end\" font-weight=\"500\" fill=\"#111\">10 m<\/text><line x1=\"170\" y1=\"64.8\" x2=\"170\" y2=\"160\" stroke=\"#111\" stroke-width=\"1.1\"/><polygon points=\"170,64.8 167,70.8 173,70.8\" fill=\"#111\"/><polygon points=\"170,160 167,154 173,154\" fill=\"#111\"/><text x=\"164\" y=\"113.375\" font-size=\"12\" text-anchor=\"end\" font-weight=\"500\" fill=\"#111\">7.5 m<\/text><\/svg><\/div>", "pre": "", "fig": "", "table": "", "stem": "이 사람의 운동에 대한 설명으로 옳은 것만을 <span class=\"nw\">&lt;보기&gt;<\/span>에서 있는 대로 고른 것은?", "kind": "bogi", "ans": 5, "sol": "B점에서 ½ × 40 × v² = 980이므로 v² = 49, v = 7 m/s이다. 속력은 질량과 관계없이 높이 차이로만 정해진다. 마찰이 있으면 역학적 에너지 일부가 열에너지로 전환되어 운동 에너지가 3920 J보다 작아진다.", "hint": "½ × 40 × v² = 980을 풀어 보세요. 속력은 질량과 관계가 있을까요?", "bogi": ["B점에서 사람의 속력은 7 m/s이다.", "질량이 더 작은 사람이 타면 C점에서의 속력이 더 빠르다.", "마찰이 있다면 C점에서 사람의 운동 에너지는 3920 J보다 작다."], "opts": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "inline": true}, {"no": 38, "part": 3, "lv": "상", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "질량이 2 kg인 공을 지면으로부터 5 m 높이에서 가만히 놓았더니, 공기 저항 때문에 지면에 닿는 순간의 속력이 7 m/s였다. 공이 떨어지는 동안 공기 저항에 의해 열에너지 등으로 전환된 에너지는? (단, 지면을 기준면으로 한다.)", "kind": "num", "ans": 3, "sol": "처음 위치 에너지는 9.8 × 2 × 5 = 98 J이고, 지면에 닿는 순간 운동 에너지는 ½ × 2 × 7² = 49 J이다. 줄어든 98 − 49 = 49 J이 열에너지 등으로 전환되었다.", "hint": "처음 위치 에너지 − 지면에 닿는 순간의 운동 에너지", "opts": ["0 J", "24.5 J", "49 J", "98 J", "147 J"], "inline": true}, {"no": 39, "part": 4, "lv": "하", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "자석과 코일을 이용한 간이 발전기에 대한 설명으로 옳은 것은?", "kind": "sent", "ans": 4, "sol": "자석이 코일 근처에서 움직이면 코일에 전류가 흐른다. 이때 움직이는 자석의 역학적 에너지가 전기 에너지로 전환된다.", "hint": "발전기의 원리: 자석이 코일 근처에서 움직이면 어떤 일이 생길까요?", "opts": ["코일 없이 자석만 흔들어도 전류가 흐른다.", "자석을 가만히 두어야 코일에 전류가 흐른다.", "전기 에너지를 역학적 에너지로 바꾸는 장치이다.", "자석이 코일 근처에서 움직이면 코일에 전류가 흐른다.", "움직이는 자석의 역학적 에너지가 모두 소리 에너지로 전환된다."], "inline": false}, {"no": 40, "part": 4, "lv": "하", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "전기 기구와 전기 에너지가 주로 전환되는 에너지를 옳게 짝지은 것은?", "kind": "sent", "ans": 5, "sol": "텔레비전은 전기 에너지를 빛에너지와 소리 에너지로 전환한다. 선풍기는 운동 에너지, 전기난로와 전기밥솥은 열에너지, 스피커는 소리 에너지로 주로 전환한다.", "hint": "각 전기 기구가 하는 일(바람, 열, 빛과 소리)을 떠올려 보세요.", "opts": ["선풍기 - 열에너지", "전기난로 - 빛에너지", "스피커 - 위치 에너지", "전기밥솥 - 소리 에너지", "텔레비전 - 빛에너지, 소리 에너지"], "inline": false}, {"no": 41, "part": 4, "lv": "하", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "소비 전력이 1000 W인 전기 주전자를 10초 동안 사용하였다. 이때 사용한 전기 에너지는?", "kind": "num", "ans": 4, "sol": "1 W는 1초마다 1 J의 전기 에너지를 사용한다는 뜻이다. 1000 W × 10 s = 10000 J이다.", "hint": "1 W는 1초마다 1 J의 전기 에너지를 사용한다는 뜻입니다.", "opts": ["10 J", "100 J", "1010 J", "10000 J", "60000 J"], "inline": true}, {"no": 42, "part": 4, "lv": "중", "group": "", "g": "", "pre": "", "fig": "", "table": "", "stem": "소비 전력이 40 W인 전등을 하루에 5시간씩 30일 동안 사용하였다. 이 전등이 사용한 전력량은?", "kind": "num", "ans": 3, "sol": "전력량 = 소비 전력 × 사용 시간 = 40 W × (5 h × 30) = 40 W × 150 h = 6000 Wh이다. ①은 하루 전력량이다.", "hint": "전력량 = 소비 전력 × 사용 시간(h). 전체 사용 시간부터 구하세요.", "opts": ["200 Wh", "1200 Wh", "6000 Wh",     document.getElementById("drop").onclick=()=>modal("풀던 기록을 지울까요?",[["취소",""],["지우기","primary",()=>{clearSave();renderStart()}]])}}
function begin(list){S.order=list;S.cur=0;S.sel={};S.hint={};S.chk={};S.res=null;S.view="quiz";save();renderQuiz();window.scrollTo(0,0)}
function check(q){if(!S.sel[q.no]||S.chk[q.no])return;S.chk[q.no]=true;save();renderQuiz()}
function renderQuiz(){
  const q=byNo(S.order[S.cur]),done=S.order.filter(n=>S.sel[n]).length,inst=S.mode==="instant",checked=inst&&S.chk[q.no];
  const nChk=S.order.filter(n=>S.chk[n]).length,nOk=S.order.filter(n=>S.chk[n]&&isOk(n)).length;
  const last=S.cur===S.order.length-1;
  let main;
  if(inst&&S.sel[q.no]&&!checked)main='<button class="btn primary" id="check">정답 확인</button>';
  else if(!last)main='<button class="btn primary" id="next">다음 문항</button>';
  else main='';
  root.innerHTML=TOP("중간고사 대비 훈련 50제")+'<div class="count">'+(inst?'맞힌 문항 <b>'+nOk+'</b> / 확인 '+nChk:'푼 문항 <b>'+done+'</b> / '+S.order.length)+'</div></div>'+gauge("quiz")+
   '<div class="panel"><div class="meta"><span class="tag">PART '+(q.part+1)+' '+PN[q.part]+'</span><span class="tag lv lv-'+q.lv+'">'+q.lv+'</span></div>'+qBody(q,checked)+
   (S.hint[q.no]&&!checked?'<div class="hintbox"><b>힌트</b>'+q.hint+'</div>':'')+
   (checked?'<div class="fb '+(isOk(q.no)?'ok':'bad')+'"><p class="fh">'+(isOk(q.no)?'정답입니다.':'오답입니다. 정답은 '+NUM[q.ans-1]+'입니다.')+'</p><p>'+q.sol+'</p></div>':'')+
   '<div class="bar"><button class="btn" id="prev"'+(S.cur===0?' disabled':'')+'>이전 문항</button><button class="btn amber" id="hint"'+(S.hint[q.no]||checked?' disabled':'')+'>힌트 보기</button><span class="grow"></span>'+
   main+'<button class="btn'+(last&&!(inst&&S.sel[q.no]&&!checked)?' primary':'')+'" id="submit">'+(inst?'결과 보기':'채점하기')+'</button></div>'+
   '<div class="keys">키보드: 1~5 답 고르기'+(inst?' · Enter 정답 확인':'')+' · ← → 문항 이동 · H 힌트</div></div>';
  if(!checked)root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.sel[q.no]=+b.dataset.k;save();renderQuiz()});
  root.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.go;save();renderQuiz()});
  const g=id=>document.getElementById(id);
  g("prev").onclick=()=>{if(S.cur>0){S.cur--;save();renderQuiz()}};
  if(g("next"))g("next").onclick=()=>{S.cur++;save();renderQuiz();window.scrollTo(0,0)};
  if(g("check"))g("check").onclick=()=>check(q);
  g("hint").onclick=()=>{S.hint[q.no]=true;save();renderQuiz()};
  g("submit").onclick=trySubmit}
function trySubmit(){
  const left=S.order.filter(n=>!S.sel[n]);
  if(left.length){modal("아직 풀지 않은 문항이 "+left.length+"개 있습니다. 풀지 않은 문항은 틀린 것으로 처리됩니다.",[["계속 풀기",""],[S.mode==="instant"?"결과 보기":"채점하기","primary",grade]]);}
  else modal("모든 문항을 풀었습니다. 결과를 볼까요?",[["다시 보기",""],[S.mode==="instant"?"결과 보기":"채점하기","primary",grade]])}
function grade(){
  let tw=0,gw=0,ok={},c=0;const byP={},byL={};
  S.order.forEach(n=>{const q=byNo(n),w=W[q.lv],r=S.sel[n]===q.ans;tw+=w;if(r){gw+=w;c++}ok[n]=r;
    (byP[q.part]=byP[q.part]||[0,0]);byP[q.part][1]++;if(r)byP[q.part][0]++;
    (byL[q.lv]=byL[q.lv]||[0,0]);byL[q.lv][1]++;if(r)byL[q.lv][0]++});
  S.res={score:Math.round(gw/tw*100),c,ok,byP,byL};S.view="res";S.filter="all";clearSave();renderRes();window.scrollTo(0,0)}
function renderRes(){
  const R=S.res,n=S.order.length,hints=S.order.filter(x=>S.hint[x]).length;
  const bar=(label,a,b)=>'<div class="row"><span>'+label+'</span><div class="track"><div class="fill" style="width:'+(b?a/b*100:0)+'%"></div></div><span class="v">'+a+' / '+b+'</span></div>';
  const list=S.order.filter(x=>S.filter==="all"||(S.filter==="bad"&&!R.ok[x])||(S.filter==="hint"&&S.hint[x]));
  root.innerHTML=TOP("훈련 결과")+'</div>'+gauge("res")+
   '<div class="panel"><div class="score"><span class="big">'+R.score+'</span><span class="of">/ 100점</span></div>'+
   '<p class="stat">'+n+'문항 중 '+R.c+'문항 정답, 힌트 사용 '+hints+'회</p>'+
   '<h2>영역별 정답 수</h2><div class="rows">'+Object.keys(R.byP).map(p=>bar("PART "+(+p+1)+" "+PN[p],R.byP[p][0],R.byP[p][1])).join("")+'</div>'+
   '<h2>난이도별 정답 수</h2><div class="rows">'+["하","중","상","최상"].filter(l=>R.byL[l]).map(l=>bar(l,R.byL[l][0],R.byL[l][1])).join("")+'</div>'+
   '<div class="bar"><button class="btn primary" id="retry"'+(R.c===n?' disabled':'')+'>틀린 문항만 다시 풀기</button><button class="btn" id="home">처음 화면으로</button></div></div>'+
   '<div class="panel" style="margin-top:14px"><h2>문항별 해설</h2><div class="filters">'+
   [["all","전체"],["bad","틀린 문항"],["hint","힌트 쓴 문항"]].map(([k,t])=>'<button class="fbtn" data-f="'+k+'" aria-pressed="'+(S.filter===k)+'">'+t+'</button>').join("")+'</div>'+
   (list.length?list.map(x=>{const q=byNo(x),my=S.sel[x];return '<div class="rv" data-no="'+x+'"><div class="rh"><b>'+x+'번</b><span class="mark '+(R.ok[x]?'ok':'bad')+'">'+(R.ok[x]?'정답':'오답')+'</span><span>내 답 '+(my?NUM[my-1]:'없음')+', 정답 '+NUM[q.ans-1]+'</span><span class="tag">'+q.lv+'</span></div>'+
     '<p class="sol">'+q.sol+'</p><details><summary>문제 다시 보기</summary><div class="qview">'+qBody(q,true)+'</div></details></div>'}).join(""):'<p class="stat">해당하는 문항이 없습니다.</p>')+'</div>';
  root.querySelectorAll(".fbtn").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;renderRes()});
  root.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{const no=S.order[+b.dataset.go];S.filter="all";renderRes();const el=root.querySelector('.rv[data-no="'+no+'"]');if(el)el.scrollIntoView({block:"start"})});
  document.getElementById("retry").onclick=()=>begin(S.order.filter(x=>!R.ok[x]));
  document.getElementById("home").onclick=()=>{S.view="start";renderStart();window.scrollTo(0,0)}}
document.addEventListener("keydown",ev=>{
  if(S.view!=="quiz"||document.getElementById("sh3modal").classList.contains("open"))return;
  const q=byNo(S.order[S.cur]),locked=S.mode==="instant"&&S.chk[q.no];
  if(/^[1-5]$/.test(ev.key)&&!locked){S.sel[q.no]=+ev.key;save();renderQuiz()}
  else if(ev.key==="Enter"&&S.mode==="instant"&&S.sel[q.no]&&!S.chk[q.no]){ev.preventDefault();check(q)}
  else if(ev.key==="ArrowRight"&&S.cur<S.order.length-1){S.cur++;save();renderQuiz()}
  else if(ev.key==="ArrowLeft"&&S.cur>0){S.cur--;save();renderQuiz()}
  else if((ev.key==="h"||ev.key==="H")&&!locked){S.hint[q.no]=true;save();renderQuiz()}});
renderStart();
})();
</script>
</body>
</html>
