<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exit Ticket · 제3구역 항해 기록 등록</title>
<style>
/* ══ 세홍과학 · 제3구역 · 9차시 Exit Ticket ══ */
:root{
  --sky:#0B1220; --sky2:#16233B;
  --grass:#5DBB3A; --grass-d:#3E8C24; --dirt:#8B5A2B; --dirt-d:#63401E;
  --stone:#8A97A6; --stone-d:#5B6674; --gold:#FCC419; --gold-d:#C79100;
  --diamond:#4DD2E8; --redstone:#E0433A; --lapis:#3B6BD6; --emerald:#2FBF71;
  --ink:#E8F0F8; --mute:#9BB0C6;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"D2Coding",monospace;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--sky);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:none;font-smooth:never;}
button,input,textarea{font-family:inherit;}
.px{border:4px solid #000;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.18);border-radius:0;}
.hard{text-shadow:3px 3px 0 rgba(0,0,0,.55);}

/* ── 공통 배경 ── */
.stars{position:fixed;inset:0;background:
  radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(2px 2px at 32% 72%,#cfe,transparent),
  radial-gradient(2px 2px at 58% 22%,#fff,transparent),radial-gradient(2px 2px at 78% 58%,#dfe,transparent),
  radial-gradient(2px 2px at 88% 12%,#fff,transparent),radial-gradient(2px 2px at 46% 88%,#fff,transparent),
  linear-gradient(180deg,#0B1220,#16233B 60%,#1E3050);z-index:0;}

/* ══ 학생 화면 ══ */
.wrap{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:26px 16px 40px;}
.hdr{text-align:center;margin-bottom:18px;}
.hdr .eye{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:#7FC4F0;}
.hdr .tag{display:inline-block;background:var(--gold);color:#2A1D00;font-family:var(--mono);font-size:13px;
  font-weight:800;letter-spacing:.16em;padding:5px 14px;margin-bottom:10px;}
.hdr h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:6px;}
.hdr .sub{font-size:14px;color:var(--mute);margin-top:5px;}
.hdr .sub b{color:var(--gold);font-weight:800;}
.card{background:#1C2B44;padding:16px 18px;margin-bottom:14px;}
.card .q{font-size:16px;font-weight:800;margin-bottom:4px;}
.card .g{font-size:13px;color:var(--mute);margin-bottom:10px;line-height:1.6;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input[type=text],textarea{width:100%;background:#0F1A2B;color:var(--ink);border:3px solid #35496A;
  padding:11px 12px;font-size:15.5px;outline:none;}
input:focus,textarea:focus{border-color:var(--gold);}
textarea{resize:vertical;line-height:1.6;}
.lp{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.lpb{background:#26385A;color:var(--ink);padding:12px 10px;font-size:14.5px;font-weight:700;text-align:left;line-height:1.45;cursor:pointer;}
.lpb small{display:block;font-weight:400;font-size:12px;color:var(--mute);margin-top:3px;}
.lpb.on{background:var(--emerald);color:#06231A;}
.lpb.on small{color:#0B3B2C;}
.frame{background:#12203A;border-left:5px solid var(--gold);padding:10px 13px;font-size:13.5px;color:#D7E5F0;line-height:1.7;margin-bottom:10px;}
.frame b{color:var(--gold);}
.go{width:100%;background:var(--grass);color:#06230A;font-size:19px;font-weight:800;padding:16px;cursor:pointer;}
.go:disabled{background:#455A70;color:#8FA3B8;cursor:not-allowed;box-shadow:none;}
.msg{text-align:center;font-size:14.5px;margin-top:12px;min-height:22px;color:var(--gold);}
.done{text-align:center;padding:40px 10px;}
.done .blk{width:96px;height:96px;margin:0 auto 18px;background:var(--grass);animation:pop .5s;}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.done h2{font-size:26px;font-weight:800;margin-bottom:8px;}
.done p{color:var(--mute);font-size:15px;line-height:1.7;}
.foot{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#5E7591;margin-top:22px;}
.foot a{color:#7FC4F0;}

/* ══ 전광판 ══ */
body.board{overflow:hidden;}
.board-wrap{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;}
.b-top{padding:14px 26px;background:rgba(0,0,0,.45);display:flex;align-items:center;gap:18px;flex:0 0 auto;}
.b-top .ttl{font-size:26px;font-weight:800;letter-spacing:-.5px;}
.b-top .tagb{background:var(--gold);color:#2A1D00;font-family:var(--mono);font-size:13px;font-weight:800;letter-spacing:.14em;padding:5px 12px;}
.b-top .ttl span{color:var(--gold);}
.b-top .cnt{margin-left:auto;font-family:var(--mono);font-size:20px;font-weight:800;color:var(--grass);}
.b-top .live{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.16em;}
.b-top .live i{display:inline-block;width:10px;height:10px;background:var(--redstone);margin-right:6px;animation:pulse 1.4s infinite;}
@keyframes pulse{50%{opacity:.25}}
.b-view{flex:1 1 auto;position:relative;overflow:hidden;}
.b-roll{position:absolute;left:0;right:0;padding:0 26px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start;}
.tile{background:#22344F;padding:14px 16px;position:relative;}
.tile .cls{position:absolute;top:-4px;right:-4px;background:var(--lapis);color:#fff;font-family:var(--mono);
  font-size:13px;font-weight:800;padding:4px 10px;border:4px solid #000;}
.tile .grp{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;padding-right:90px;}
.tile .badge{display:inline-block;background:var(--gold);color:#2A1D00;font-size:14px;font-weight:800;
  padding:4px 11px;margin-bottom:9px;border:3px solid #000;}
.tile .ln{font-size:16px;line-height:1.65;color:#DCE8F4;}
.tile .ln b{color:var(--diamond);}
.tile .ev{font-size:14px;color:var(--mute);margin-top:6px;line-height:1.6;}
.tile.fresh{animation:land .6s;}
@keyframes land{0%{transform:translateY(-60px) scale(.9);opacity:0}70%{transform:translateY(6px)}100%{transform:none;opacity:1}}
.b-bot{flex:0 0 auto;background:linear-gradient(180deg,var(--grass) 0 14px,var(--grass-d) 14px 22px,var(--dirt) 22px);
  height:66px;display:flex;align-items:flex-end;padding:0 26px 10px;gap:20px;}
.b-bot .t{font-family:var(--mono);font-size:14px;color:#F3E2CE;letter-spacing:.1em;}
.wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.wait .b{width:64px;height:64px;background:var(--stone);animation:bob 1.2s infinite alternate;}
@keyframes bob{to{transform:translateY(-16px)}}
.wait .t{font-size:24px;font-weight:800;color:var(--mute);}
.sprites{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.sp{position:absolute;image-rendering:pixelated;}
@keyframes drift{from{transform:translateX(-240px)}to{transform:translateX(calc(100vw + 240px))}}
@keyframes drift2{from{transform:translateX(calc(100vw + 200px)) scaleX(-1)}to{transform:translateX(-200px) scaleX(-1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-420px,300px);opacity:0}}
.sp.ship{top:9%;animation:drift 34s linear infinite;animation-delay:-9s;}
.sp.ufo{top:22%;animation:drift2 46s linear infinite;animation-delay:-14s;}
.sp.ufo .in{animation:bob 3s ease-in-out infinite;}
.sp.planet{right:5%;top:14%;opacity:.65;animation:spin 120s linear infinite;}
.sp.star{right:12%;top:6%;animation:shoot 9s ease-in infinite;}
.sp.crew{bottom:66px;}
.sp.crew.a{left:5%;animation:hop 2.6s ease-in-out infinite;}
.sp.crew.b{left:15%;animation:hop 2.6s ease-in-out infinite .8s;}
.sp.crew.c{left:44%;animation:hop 3.1s ease-in-out infinite .4s;}
.b-ctl{position:fixed;right:14px;bottom:76px;z-index:5;display:flex;gap:8px;opacity:.25;transition:opacity .2s;}
.b-ctl:hover{opacity:1;}
.b-ctl button{background:#22344F;color:var(--ink);font-size:12.5px;font-weight:700;padding:8px 12px;cursor:pointer;}
@media (max-width:900px){ .b-roll{grid-template-columns:1fr;} .lp{grid-template-columns:1fr;} .row2{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="stars"></div>
<div id="app"></div>

<script>
(function(){
"use strict";
/* ═══════════════════════════════════════════════════════
   ★ 여기에 구글 앱스 스크립트 웹앱 URL을 붙여넣으세요 ★
   ═══════════════════════════════════════════════════════ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxWHWuYvH2x79RdNJY0VJoLcIxDG5EZtDb01MIBVyoVGoddbxBliyK0CF8uJnyePYj/exec";

const LP=[
 ['사고하는 사람','잃어버린 에너지를 끝까지 따라갔다'],
 ['소통하는 사람','우리 생각을 남이 읽게 정리했다'],
 ['원칙을 지키는 사람','틀린 연결을 그냥 넘기지 않았다'],
 ['성찰하는 사람','우리가 헷갈린 곳에 이름을 붙였다']
];
const DEMO=[
 {cls:'3-2',grp:'4모둠',lp:'사고하는 사람',line:'우리 지도에서 위치 E와 전기 E가 단위로 이어져 있다. 그래서 물이 떨어지는 것과 난로가 켜지는 것을 같은 J로 비교할 수 있다.',ev:'마찰로 잃은 에너지가 열 카드로 가는 걸 찾아냈다'},
 {cls:'3-2',grp:'1모둠',lp:'원칙을 지키는 사람',line:'우리 지도에서 역학적 E와 보존이 조건으로 이어져 있다. 그래서 마찰이 없을 때만 보존된다.',ev:'선을 세 번 지우고 다시 그었다'},
 {cls:'3-5',grp:'초신성',lp:'성찰하는 사람',line:'우리 지도에서 속력과 운동 E가 제곱 비례로 이어져 있다. 그래서 속력이 2배면 에너지는 4배다.',ev:'우리가 계속 ½을 빠뜨린다는 걸 알았다'}
];
const q=new URLSearchParams(location.search);
const isBoard=q.get('mode')==='board';
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ══════════ 학생 화면 ══════════ */
function studentView(){
  let lp='';
  document.getElementById('app').innerHTML=`
  <div class="wrap">
    <div class="hdr">
      <div class="tag px">EXIT TICKET</div>
      <div class="eye">SECTOR 03 · LESSON 09 · 모둠 제출</div>
      <h1>항해 기록 등록</h1>
      <div class="sub">지도 복구 완료. 오늘의 <b>Exit Ticket</b>을 모둠 이름으로 본부에 전송하라.</div>
    </div>
    <div class="card px">
      <div class="q">모둠 확인</div>
      <div class="g">전광판에 이 이름이 올라간다.</div>
      <div class="row2">
        <input type="text" id="cls" placeholder="학년·반 (예: 3-2)" maxlength="8" autocomplete="off">
        <input type="text" id="grp" placeholder="모둠명 (예: 4모둠)" maxlength="14" autocomplete="off">
      </div>
    </div>
    <div class="card px">
      <div class="q">1 · 우리 지도로 진술문 말하기</div>
      <div class="frame">문장 틀 — 우리 지도에서 <b>○○</b>와(과) <b>○○</b>가 <b>○○</b>로 이어져 있다. 그래서 <b>○○</b>.</div>
      <textarea id="line" rows="3" maxlength="160" placeholder="우리 지도에서 ..."></textarea>
    </div>
    <div class="card px">
      <div class="q">2 · 오늘 우리 모둠은</div>
      <div class="g">하나만 고른다.</div>
      <div class="lp" id="lp">${LP.map((x,i)=>`<button class="lpb px" data-i="${i}">${x[0]}<small>${x[1]}</small></button>`).join('')}</div>
      <textarea id="ev" rows="2" maxlength="90" placeholder="그 증거 한 줄 — 오늘 우리가 실제로 한 일" style="margin-top:10px"></textarea>
    </div>
    <button class="go px" id="go" disabled>기록 전송</button>
    <div class="msg" id="msg"></div>
    <div class="foot">세상에서 가장 홍미로운 과학 · 제3구역</div>
  </div>`;
  const chk=()=>{ $('#go').disabled=!($('#cls').value.trim()&&$('#grp').value.trim()&&$('#line').value.trim().length>8&&lp&&$('#ev').value.trim().length>2); };
  ['cls','grp','line','ev'].forEach(id=>$('#'+id).addEventListener('input',chk));
  $('#lp').addEventListener('click',e=>{const b=e.target.closest('.lpb');if(!b)return;
    document.querySelectorAll('.lpb').forEach(x=>x.classList.remove('on'));b.classList.add('on');lp=LP[+b.dataset.i][0];chk();});
  $('#go').addEventListener('click',()=>{
    const d={cls:$('#cls').value.trim(),grp:$('#grp').value.trim(),lp,line:$('#line').value.trim(),ev:$('#ev').value.trim()};
    $('#go').disabled=true; $('#msg').textContent='통신 위성으로 전송 중...';
    if(!SCRIPT_URL){ setTimeout(()=>done(d),600); return; }
    fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(d)})
      .then(r=>r.text()).then(()=>done(d))
      .catch(()=>{ $('#msg').textContent='⚠ 전송 실패. 다시 눌러 보자.'; $('#go').disabled=false; });
  });
  function done(d){
    document.getElementById('app').innerHTML=`<div class="wrap"><div class="done">
      <div class="blk px"></div><h2>Exit Ticket 전송 완료</h2>
      <p><b>${esc(d.cls)} ${esc(d.grp)}</b><br>전광판을 보자. 곧 올라온다.</p>
    </div><div class="foot">세상에서 가장 홍미로운 과학 · 제3구역</div></div>`;
  }
}

/* ══════════ 전광판 ══════════ */
function boardView(){
  document.body.classList.add('board');
  var px=function(g,c,sc){ /* g: 문자열 배열, c: 색 맵 */
    var w=g[0].length,h=g.length,o='';
    for(var y=0;y<h;y++) for(var x=0;x<w;x++){ var k=g[y][x]; if(k===' ') continue;
      o+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+c[k]+'"/>'; }
    return '<svg width="'+w*sc+'" height="'+h*sc+'" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges">'+o+'</svg>';
  };
  var SHIP=px([
   '    RR    ','   RWWR   ','  RWWWWR  ','  RWCCWR  ','  RWCCWR  ',
   ' RRWWWWRR ','RRRWWWWRRR','RR RWWR RR','   YOOY   ','    OO    ','    Y     '],
   {R:'#E0433A',W:'#EAF0FF',C:'#4DD2E8',Y:'#FCC419',O:'#FF9147'},4);
  var UFO=px([
   '   CCCC   ','  CWWWWC  ',' CW C C WC',' CWWWWWWC ','SSSSSSSSSS','S GG GG  S',' SSSSSSSS ','  Y  Y  Y '],
   {C:'#4DD2E8',W:'#EAF0FF',S:'#A06BEA',G:'#FCC419',Y:'#9BE8D8'},4);
  var PLANET=px([
   '  PPPPPP  ',' PPMMPPPP ','PPMMPPPPPP','PPPPPPMMPP','PPPPPPPPPP','PPMMPPPPPP',' PPPPMMPP ','  PPPPPP  '],
   {P:'#C08BE0',M:'#8E5FB0'},7);
  var STAR=px(['  W ',' WWW','WWWWW',' WWW','  W '],{W:'#FFF3CE'},4);
  function crew(body,helmet){ return px([
   '  HHHH  ',' HCCCCH ','HCCWWCCH','HCCWWCCH',' HCCCCH ','  BBBB  ',' BBBBBB ','B BBBB B',
   '  B  B  ','  B  B  ',' WW  WW '],{H:helmet,C:'#22344F',W:'#EAF0FF',B:body},4); }
  var CREW1=crew('#3B8FEF','#EAF0FF'), CREW2=crew('#25C2A0','#FCC419'), CREW3=crew('#FF9147','#EAF0FF');
  document.getElementById('app').innerHTML=`
  <div class="sprites">
    <div class="sp ship">${SHIP}</div>
    <div class="sp ufo"><div class="in">${UFO}</div></div>
    <div class="sp planet">${PLANET}</div>
    <div class="sp star">${STAR}</div>
    <div class="sp crew a">${CREW1}</div>
    <div class="sp crew b">${CREW2}</div>
    <div class="sp crew c">${CREW3}</div>
  </div>`+`
  <div class="board-wrap">
    <div class="b-top px" style="border-width:0 0 4px 0">
      <div class="tagb px">EXIT TICKET</div><div class="ttl">제3구역 <span>항해 기록</span></div>
      <div class="live"><i></i>LIVE</div>
      <div class="cnt" id="cnt">0 모둠</div>
    </div>
    <div class="b-view"><div class="b-roll" id="roll"></div><div class="wait" id="wait"><div class="b px"></div><div class="t">기록 수신 대기 중...</div></div></div>
    <div class="b-bot"><div class="t" id="bycls"></div><div class="t" style="margin-left:auto">세상에서 가장 홍미로운 과학</div></div>
  </div>
  <div class="b-ctl"><button class="px" id="bgm">🔈 BGM 켜기</button><button class="px" id="slow">느리게</button><button class="px" id="fast">빠르게</button><button class="px" id="pause">일시정지</button></div>`;
  let data=[], y=0, speed=0.28, paused=false, seen=new Set();
  const roll=$('#roll'), view=roll.parentElement;

  function draw(){
    roll.innerHTML=tile(data); const needLoop=roll.scrollHeight>view.clientHeight;
    if(needLoop) roll.innerHTML=tile(data.concat(data)); else { y=0; roll.style.transform='none'; }
    data.forEach(d=>seen.add(d.cls+'|'+d.grp));
    $('#cnt').textContent=data.length+' 모둠';
    $('#wait').style.display=data.length?'none':'flex';
    const by={}; data.forEach(d=>by[d.cls]=(by[d.cls]||0)+1);
    $('#bycls').textContent=Object.keys(by).sort().map(k=>`${k} · ${by[k]}`).join('   ');
  }
  function tile(arr){
    return arr.map((d,i)=>{
      const key=d.cls+'|'+d.grp, fresh=(i<data.length&&!seen.has(key));
      return `<div class="tile px${fresh?' fresh':''}"><div class="cls">${esc(d.cls)}</div>
        <div class="grp">${esc(d.grp)}</div>
        <div class="badge">${esc(d.lp)}</div>
        <div class="ln">${esc(d.line)}</div>
        <div class="ev">▸ ${esc(d.ev)}</div></div>`;
    }).join('');
  }
  function tick(){
    if(!paused&&data.length){
      const half=roll.scrollHeight/2;
      if(roll.scrollHeight>view.clientHeight){ y-=speed; if(-y>=half) y+=half; roll.style.transform=`translateY(${y}px)`; }
    }
    requestAnimationFrame(tick);
  }
  function pull(){
    if(!SCRIPT_URL){ if(!data.length){ data=DEMO.slice(); draw(); } return; }
    fetch(SCRIPT_URL+'?list=1',{cache:'no-store'}).then(r=>r.json()).then(list=>{
      if(!Array.isArray(list)) return;
      if(list.length!==data.length){ data=list; draw(); }
    }).catch(()=>{});
  }
  $('#slow').onclick=()=>speed=Math.max(.08,speed-.1);
  $('#fast').onclick=()=>speed=Math.min(1.2,speed+.1);
  $('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'다시 시작':'일시정지';};
  /* ── 8비트 BGM (외부 파일 없음 · Web Audio 합성) ── */
  var AC=window.AudioContext||window.webkitAudioContext, actx=null, master=null, seqT=null, step=0, playing=false;
  var LEAD=[
    72,76,79,84, 83,79,76,79, 81,77,74,77, 76,72,null,null,
    74,77,81,84, 83,81,79,76, 77,74,71,74, 72,null,null,null,
    84,null,83,81, 79,81,83,84, 86,null,84,83, 81,83,84,86,
    88,84,81,79, 77,79,81,84, 83,79,76,72, 74,76,72,null];
  var BASS=[
    36,48,43,48, 36,48,43,48, 41,53,48,53, 41,53,48,53,
    38,50,45,50, 38,50,45,50, 43,55,50,55, 43,55,50,55,
    36,48,43,48, 36,48,43,48, 41,53,48,53, 41,53,48,53,
    43,55,50,55, 41,53,48,53, 36,48,43,48, 43,50,43,null];
  function hz(n){ return 440*Math.pow(2,(n-69)/12); }
  function blip(note,type,dur,vol,detune){
    if(note===null) return;
    var t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(hz(note),t);
    if(detune) o.detune.setValueAtTime(detune,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function hat(){
    var t=actx.currentTime, len=0.045, sr=actx.sampleRate;
    var buf=actx.createBuffer(1,Math.floor(sr*len),sr), d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    var src=actx.createBufferSource(); src.buffer=buf;
    var g=actx.createGain(); g.gain.setValueAtTime(0.05,t);
    var hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
    src.connect(hp); hp.connect(g); g.connect(master); src.start(t);
  }
  function nextStep(){
    var i=step%64;
    var swing = (i%2===1);
    blip(LEAD[i],'square',swing?0.10:0.15,swing?0.055:0.085,0);
    blip(BASS[i],'triangle',0.18,0.105,0);
    if(i%4===0||i%4===2) hat();
    step++;
  }
  function bgmOn(){
    if(!actx){ actx=new AC(); master=actx.createGain(); master.gain.value=0.45; master.connect(actx.destination); }
    if(actx.state==='suspended') actx.resume();
    playing=true; step=0;
    seqT=setInterval(nextStep,128);   /* 약 117 BPM · 8분음표, 경쾌하게 */
    $('#bgm').textContent='🔊 BGM 끄기';
  }
  function bgmOff(){
    playing=false; clearInterval(seqT); seqT=null;
    $('#bgm').textContent='🔈 BGM 켜기';
  }
  $('#bgm').addEventListener('click',function(){ playing?bgmOff():bgmOn(); });
  document.addEventListener('keydown',function(e){ if(e.key==='m'||e.key==='M'){ playing?bgmOff():bgmOn(); } });

  draw(); pull(); setInterval(pull,5000); tick();
}

isBoard?boardView():studentView();
})();
</script>
